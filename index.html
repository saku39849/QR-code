<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード生成ツール</title>
  <!-- QRコードを生成するための軽量ライブラリを読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 16px;
      color: #60a5fa;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #ef4444;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #2563eb, #dc2626);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #qrcode-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
    }
    .download-btn {
      margin-top: 12px;
      background: #334155;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>QRコード作成ツール</h1>
    <input type="text" id="url-input" placeholder="ここにURLや文字を入力..." />
    <button onclick="generateQR()">QRコードを作成</button>

    <div id="qrcode-container">
      <span style="color: #64748b; font-size: 0.9rem;">URLを入力してボタンを押してください</span>
    </div>

    <button id="download-btn" class="download-btn" onclick="downloadQR()">画像を保存</button>
  </div>

  <script>
    function generateQR() {
      const input = document.getElementById("url-input").value.trim();
      const container = document.getElementById("qrcode-container");
      const downloadBtn = document.getElementById("download-btn");

      if (!input) {
        alert("URLまたは文字を入力してください");
        return;
      }

      // 前のQRコードをクリア
      container.innerHTML = "";

      // 新しいQRコードを生成
      new QRCode(container, {
        text: input,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // 保存ボタンを表示
      downloadBtn.style.display = "block";
    }

    function downloadQR() {
      const img = document.querySelector("#qrcode-container img");
      if (img && img.src) {
        const link = document.createElement("a");
        link.href = img.src;
        link.download = "qrcode.png";
        link.click();
      }
    }
  </script>

</body>
</html>
